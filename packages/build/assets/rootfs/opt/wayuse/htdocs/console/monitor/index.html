<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} monitor</title>
  <link rel="stylesheet" href="../css/console.css">
  <link rel="stylesheet" href="../../custom/styles.css">
  <script type="module" src="../js/monitor.js"></script>
  <script type="module" src="../../custom/script.js"></script>
</head>
<body id="wayuse-monitor">
<header class="header">
  <div class="header-brand">
    <span class="header-icon">{{icon}}</span>
    <span class="header-title">{{title}}</span>
    <span class="header-badge">monitor</span>
  </div>
  <div class="header-meta">
    <span id="host"></span>
    <a href="../api/">API</a>
  </div>
</header>

<div class="monitor-toolbar">
  <label for="auto">Refresh</label>
  <select id="auto" title="HIGH waits a second after each picture and goes round all screens. LOW waits a minute after each round.">
    <option value="off">OFF</option>
    <option value="fast">HIGH</option>
    <option value="slow">LOW</option>
  </select>
  <button type="button" class="button-sub" id="recapture-all" title="Capture every screen again">🔄</button>
  <span class="status" id="status"></span>
  <span class="monitor-load" id="load"></span>
</div>

<!-- One tile for each screen, made by the script. A click on its picture is sent as a click at that pixel. -->
<main class="monitor-grid" id="grid"></main>
</body>
</html>
