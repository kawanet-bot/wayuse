# make -C ../builder/pack && npx wayuse-build --server-tarball ../builder/pack/server.tgz && docker compose up --build -d
# npx wayuse jwt keygen > .env  # once: compose reads .env, and only the public key below reaches the container

name: wayuse-sample

volumes:
  config-volume: # Chrome's profile outlives the image

services:
  wayuse:
    build:
      context: "./.wayuse/"
    shm_size: "256mb" # sway dies of a bus error on the 64MB Docker gives by default
    extra_hosts:
      - "host.docker.internal:host-gateway" # a server on this host is http://host.docker.internal:<port>/
    ports:
      # Reached from this host alone, unless .env says otherwise: WAYUSE_PUBLISH=0.0.0.0:9580
      - "${WAYUSE_PUBLISH:-127.0.0.1:9580}:9580"
    environment:
      WAYUSE_OUTPUTS: "2"
      WAYUSE_JWT_PUBLIC_KEY: "${WAYUSE_JWT_PUBLIC_KEY:-}"
    volumes:
      - "config-volume:/home/wayuse/.config"
