name: Publish wayuse

# Releases are cut by pushing a version tag, so ordinary pushes never reach
# npm. The tag names the package, as each is released apart from the others.
on:
  push:
    tags: [ "wayuse@0.*.*" ]

permissions: { }

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      package: wayuse
    permissions:
      contents: read
      id-token: write
